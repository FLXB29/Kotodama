name: Quality gate

on:
  push:
    branches: ['**']
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: Verify quality gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: kotodama
          POSTGRES_PASSWORD: kotodama_ci_password
          POSTGRES_DB: kotodama
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U kotodama -d kotodama"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://kotodama:kotodama_ci_password@127.0.0.1:5432/kotodama
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install locked dependencies
        run: npm ci

      - name: Apply PostgreSQL migrations
        run: npm run db:migrate

      - name: Run quality gate
        run: npm run quality
